<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">BIPKB — conceptual federation boundaries</title><desc id="desc">Proposed documentary relationships, not implemented adapters, exclusive ownership or approved semantic mappings. A1 S010–S016 and L008–L012; EIRKB boundary review added in A2 section 3.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#65758b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<path d="M600,120 L600,170" stroke="#65758b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36445b">documents</text>
<path d="M600,280 L600,320" stroke="#65758b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="600" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36445b">may reference</text>
<path d="M600,430 L600,470" stroke="#65758b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="600" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36445b">boundary review only</text>
<path d="M600,580 L600,620" stroke="#65758b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="600" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36445b">methodological safeguards for</text>
<rect x="40" y="20" width="1120" height="100" rx="10" fill="#cce3f9" stroke="#173b6b" stroke-width="2"/>
<text x="600" y="56" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">BIPKB — Bioindicators and Phenotypes Knowledge Base</text>
<text x="600" y="84" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Provisional research project · Documentary candidates</text>
<rect x="40" y="170" width="1120" height="110" rx="10" fill="#e1f0e6" stroke="#41744d" stroke-width="2"/>
<text x="600" y="197" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">Organisms, phenotypes, traits and bioindication</text>
<text x="600" y="225" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Research leads and qualified interpretation · Not verified observations</text>
<text x="600" y="253" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Related knowledge bases: AMRKB · EIRKB — boundary review pending</text>
<rect x="40" y="320" width="1120" height="110" rx="10" fill="#feeec9" stroke="#a16a16" stroke-width="2"/>
<text x="600" y="361" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">Autonomous scientific and geographic source catalogues</text>
<text x="600" y="389" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">EII indicators · OSDS observation systems · GISDS spatial sources</text>
<rect x="40" y="470" width="1120" height="110" rx="10" fill="#e1daf0" stroke="#574087" stroke-width="2"/>
<text x="600" y="497" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">DRM — developing methodological reference</text>
<text x="600" y="525" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Identity · Evidence and rights · Classifications · Qualified relationships</text>
<text x="600" y="553" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">MSP 0.1.0 revision 2 remains an unadopted candidate</text>
<rect x="40" y="620" width="1120" height="110" rx="10" fill="#cce3f9" stroke="#173b6b" stroke-width="2"/>
<text x="600" y="647" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">IRKB — independently authored synthesis</text>
<text x="600" y="675" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Interpretations retain evidence, uncertainty and situated authority</text>
<text x="600" y="703" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">No operational integration or scientific approval implied</text>
</svg>
