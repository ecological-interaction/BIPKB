<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">BIPKB — evidence-based conceptual reconstruction</title><desc id="desc">Reconstructed from A1 C001–C025, E001–E015 and L001–L007. Candidate interpretation only; traits and occurrence do not uniquely diagnose causes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#65758b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<path d="M600,130 L600,190" stroke="#65758b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36445b">requires contextual assessment</text>
<path d="M600,300 L600,360" stroke="#65758b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="600" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36445b">may inform, subject to evidence</text>
<path d="M600,470 L600,530" stroke="#65758b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="600" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36445b">requires</text>
<rect x="40" y="20" width="1120" height="110" rx="10" fill="#e1f0e6" stroke="#41744d" stroke-width="2"/>
<text x="600" y="47" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">Organismal evidence and concepts</text>
<text x="600" y="75" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Taxon occurrence · Phenotype observations · Functional traits</text>
<text x="600" y="103" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">A1 C001–C008, C011–C018 · L001–L005</text>
<rect x="40" y="190" width="1120" height="110" rx="10" fill="#feeec9" stroke="#a16a16" stroke-width="2"/>
<text x="600" y="217" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">Context, timescale and biological history</text>
<text x="600" y="245" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Genetics · Development · Environment · Biological archives</text>
<text x="600" y="273" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">A1 C019–C025 · E013–E015 · L002–L007</text>
<rect x="40" y="360" width="1120" height="110" rx="10" fill="#cce3f9" stroke="#173b6b" stroke-width="2"/>
<text x="600" y="387" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">Candidate ecological interpretation</text>
<text x="600" y="415" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Indicator inference · Environmental change · Regional signatures</text>
<text x="600" y="443" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">A1 L001–L007: may support, reflect or inform — not equivalence</text>
<rect x="40" y="530" width="1120" height="110" rx="10" fill="#eaedf1" stroke="#7c8c9d" stroke-width="2"/>
<text x="600" y="557" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#25334a">Evidence and inference safeguards</text>
<text x="600" y="585" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Calibration · Sampling · Confounders · Dating and uncertainty</text>
<text x="600" y="613" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#25334a">Hypothetical examples are not empirical observations</text>
</svg>
